  - id: "3.2"
    stage: 3
    date: 2026-11-14
    title: Checking our ruler on the authors' own maps
    summary: Scored the prediction maps the authors released for PraNet, U-Net, U-Net++ and SFA with our port of their evaluation, and compared every number with PraNet's Tables 1-2.
    why: Same files, so only the evaluation code can differ. If our numbers match theirs, later differences between our models and the literature are about the models, not the measurement (decision D13).
    tests: 125
    results:
      - {label: Published numbers reproduced, value: "20 of 20 within 0.005"}
      - {label: Matching to the third decimal, value: "19 of 20"}
      - {label: Largest gap, value: "+0.0025, PraNet on CVC-ColonDB"}
      - {label: Baseline maps the evaluation skips, value: "21 of 380 on CVC-ColonDB"}
      - {label: "Effect of MATLAB's float thresholds", value: "at most 0.0001"}
      - {label: "Boundary IoU, one 1225 x 966 image on the CPU", value: "about 100 s to 3 ms"}
    problems:
      - kind: published
        what: "In the released U-Net, U-Net++ and SFA maps, CVC-ColonDB images 77-97 are saved as .tif, and the evaluation lists only .png files. Those baselines were scored on 359 images, PraNet on all 380."
        found: Our scores matched the published ones only when the 21 .tif maps were left out.
        fix: We report both. With all 380 maps the baselines drop by 0.001 to 0.013 (research finding 9).
      - kind: published
        what: "PraNet on CVC-ColonDB is 0.709 in the PraNet paper, but its released maps give 0.7115, which is the 0.712 the Polyp-PVT paper reports."
        found: The only one of 20 rows outside rounding.
        fix: Recorded as finding 4, resolved; still within the 0.005 tolerance.
      - kind: library
        what: "PyTorch's CPU max-pool with stride 1 is slow for wide windows: one 63 x 63 pool on a 1225 x 966 image took 50 s, and Boundary IoU needs two."
        found: The first full run had printed nothing after ten minutes; timing each step pointed to the pool.
        fix: "A window-doubling sliding max (about log2 of the window in element-wise steps); identical to the max-pool on 200 random cases, now a test."
      - kind: ours
        what: "Our port of MATLAB's mapminmax handled a constant map wrongly: for a zero range it replaces both the gain and the offset, and we replaced only the gain."
        found: A new test with a constant map failed.
        fix: Both replaced, as in mapminmax.m. None of the 3,129 released .png maps is constant, so no number changed.
      - kind: ours
        what: The first run crashed on a blank mIoU cell in our table of published numbers (ResUNet-mod has no mIoU in the paper).
        found: The script stopped with a conversion error.
        fix: Blank cells are read as missing values.
      - kind: data
        what: The U-Net and U-Net++ Kvasir folders hold 200 files for 100 images, an extra 256 x 256 .jpg next to each full-size .png.
        found: Counting files against the ground truth.
        fix: The evaluation reads only the .png maps, as main.m does.
    files: [scripts/eval_published_maps.py, src/seg/metrics.py, src/seg/stats.py, reports/stage3_published_maps.md, tests/test_metrics.py, tests/test_stats.py]

  - id: "3.3"
    stage: 3
    date: 2026-11-14
    title: The released weights, run on the Mac
    summary: Ran the released PraNet weights on all five test sets, on the Apple GPU and on the CPU, following the authors' test script step by step, and scored the output with the evaluation checked in 3.2.
    why: "3.2 checked the ruler; this checks the whole pipeline: loading, preprocessing, inference on a non-CUDA device, saving and scoring. It is the second half of decision D13."
    tests: 131
    results:
      - {label: Published numbers reproduced, value: "5 of 5 within 0.005"}
      - {label: "Maps equal to the authors' (4 lossless sets)", value: "698 of 698 within one 8-bit level"}
      - {label: "Kvasir, against the authors' maps", value: "-0.0038 mDice, every image differs"}
      - {label: Apple GPU against CPU, value: "at most 0.00001 per image"}
      - {label: "Forward pass, Apple GPU", value: "31 ms, rising to 44-49 ms late in the run"}
      - {label: "Forward pass, CPU", value: "50-59 ms"}
    problems:
      - kind: data
        what: "On Kvasir, and only there, our maps differ from the authors' on every image (mean 0.6 levels, up to 243 at polyp edges) and mDice is 0.0038 lower (paired bootstrap interval -0.0085 to -0.0003). Kvasir is the only test set whose originals are JPEG."
        found: Comparing our maps with the authors' image by image; the other four sets agree within one level.
        fix: "Not explained yet, and recorded as open. Ruled out: the model and code (four sets match), the device (CPU equals GPU), our copy of the images (the benchmark's PNGs equal the original Kvasir-SEG JPEGs pixel for pixel). Decoding the JPEGs with Apple's decoder instead of Pillow moves single images by up to 0.17 mDice but the mean by only 0.0001. Still inside the 0.005 tolerance against the paper (-0.0036)."
      - kind: ours
        what: "3.1 quoted 56 ms per image on the Apple GPU. That came from a smoke test: one batch of 2 timed straight after loading, with no warm-up."
        found: The proper measurement here (5 warm-up passes, synchronised timing, median over 798 images) gave 31 ms.
        fix: Speeds are now measured only by the run scripts, with warm-up and synchronisation; 3.1's number stays in its entry as history.
      - kind: ours
        what: "On the Apple GPU the forward pass slowed from 31 ms to 44-49 ms over the last two test sets, with the same input size. The likely cause is heat on the fanless MacBook Air, not verified."
        found: The per-set medians in the report.
        fix: Stage 7's latency numbers will alternate models and rest between runs, and report the spread, not one median.
      - kind: ours
        what: "Three labels in two older Journal charts (set sizes, parameters) ran past the left edge on phones; the J.1 check had measured only the newest charts."
        found: Checking every text element of every chart at 375 and 390 px, not just the new ones.
        fix: Shorter labels on narrow screens and a wider label column; every chart is now checked on each change.
    files: [scripts/run_pranet_weights.py, scripts/check_kvasir_decoding.py, src/seg/evaluate.py, src/seg/metrics.py, reports/stage3_pranet_weights.md, reports/stage3_kvasir_decoding.json, tests/test_evaluate.py, site/assets/journal.js]

