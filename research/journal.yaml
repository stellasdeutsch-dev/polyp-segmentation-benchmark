  - id: "4.1"
    stage: 4
    date: 2026-11-14
    title: A U-Net written from scratch
    summary: "Our own U-Net after the 2015 paper, with the milesial-style changes fixed in decision D12: padded convolutions, BatchNorm, transposed-convolution upsampling, 64 channels doubling to 1,024, He initialisation. Checked against milesial/Pytorch-UNet by copying weights across."
    why: "Rung 1 of the ladder has to be a real U-Net, not a weak strawman, and it has to be our code. Matching a widely used implementation exactly shows both."
    tests: 153
    results:
      - {label: Parameters, value: "31,037,633, equal to a hand count"}
      - {label: "Output against milesial, same weights", value: "bit-identical, in eval and train mode"}
      - {label: "Gradients against milesial", value: "equal within 1e-5"}
      - {label: Input sizes, value: "any, including odd sizes such as 33 x 47"}
    problems:
      - kind: published
        what: "milesial's train.py catches a CUDA out-of-memory error and calls model.use_checkpointing() to retry with less memory. That method calls torch.utils.checkpoint, which is a module, not a function, so the retry itself crashes with a TypeError."
        found: Reading the reference code before the comparison test, then calling the method in a test.
        fix: "Nothing to fix on our side: our loop does not retry on out-of-memory. A test pins the behaviour, and the finding is recorded in the lineage notes."
    files: [src/seg/unet.py, src/seg/models.py, scripts/fetch_milesial.py, tests/test_unet.py, configs/unet.yaml]

  - id: "4.2"
    stage: 4
    date: 2026-11-14
    title: What the U-Net costs, and the training queue
    summary: "Timed the from-scratch U-Net in the real training loop and in a step benchmark against cheaper variants, fixed its budget, and started decision D7's five runs through a resumable queue."
    why: "Decision D8 says rung 1's epoch time is measured before its runs start. At the paper's widths one run takes hours, so the budget and the cheaper options had to be measured, not guessed."
    tests: 153
    results:
      - {label: "Training time per epoch, real loop", value: "302-491 s (3 epochs)"}
      - {label: "One 50-epoch run / five runs", value: "about 4-7 h / 20-35 h"}
      - {label: "Forward pass per 256 px image", value: "96.3 GFLOP, vs 15.6 for the ResNet-34 U-Net"}
      - {label: "Half precision (float16 / bfloat16)", value: "2% / 5% faster, not used"}
      - {label: "nnU-Net widths (32-512)", value: "2.3x faster, kept for a stage 7 ablation"}
      - {label: Peak memory, value: "5.7 GB of 11.84 GB"}
    problems:
      - kind: library
        what: "Switching the U-Net to channels-last memory, which speeds up convolutions on NVIDIA GPUs, made each training step 2.3 times slower on Apple's GPU."
        found: The step benchmark.
        fix: Not used. Recorded in decision D8 with the benchmark file.
      - kind: ours
        what: "In the step benchmark the ResNet-34 U-Net came out at 65 s per epoch, against 37 s measured in 2.5. The benchmark ran straight after 20 minutes of training, on a hot laptop."
        found: Comparing the anchor row with the number already in decision D8.
        fix: "Only ratios between variants timed back to back are used from the benchmark; absolute run times come from each run's own log."
    files: [scripts/time_unet.py, scripts/run_queue.py, reports/stage4_timing.json, configs/unet.yaml, Makefile]

  - id: "4.3"
    stage: 4
    date: 2026-11-14
    title: Scoring a trained model on the test sets
    summary: "A script that takes a run's validation-chosen checkpoint and scores it on the five test sets: Dice, IoU and Boundary IoU at 0.5 on the raw probability, and PraNet-style mDice on the 8-bit map PraNet's test script would have saved, with bootstrap intervals."
    why: "Our models must be scored on test by the same rule that picked their checkpoint on validation, and with PraNet's own metric for the comparison with published numbers."
    tests: 156
    results:
      - {label: "Validation Dice, test path vs training loop", value: "0.564492 vs 0.564491"}
      - {label: Per test set, value: "mDice, Dice at 0.5 with 95% interval, IoU, Boundary IoU, per-image rows"}
    problems:
      - kind: ours
        what: "The first smoke test scored every image as 0. Our loader returns masks as 0 and 1; the scoring code, written for the authors' 0-255 PNGs, counts a pixel as polyp above 128, so every mask was empty."
        found: "A 3-epoch checkpoint that reached 0.56 validation Dice scored 0.00 on every test set."
        fix: "Masks are passed as booleans, and the scoring code now refuses an integer mask whose largest value is 1 instead of reading it as empty. A test covers both."
      - kind: ours
        what: "The fix to the script did not land at first: the formatter had already rewritten the line the edit was looking for, so the second smoke test failed with the new error."
        found: The new check raised on the next run, which is what it was added for.
        fix: Re-applied to the reformatted line and checked that it took effect before rerunning.
      - kind: ours
        what: "PraNet's \"Dice at 0.5\" in 3.3 was taken on the stretched saved map; ours is on the raw probability. The two are not the same quantity."
        found: Writing the scoring path for our own models next to the one used in 3.3.
        fix: "Recorded under decision D4. PraNet's Dice at 0.5 is recomputed on its raw probability before it appears in a table next to our models; mDice is unaffected."
      - kind: ours
        what: "Running the test suite and the smoke tests while the first U-Net run was training made its epoch 3 take 1,890 s instead of about 300 s. The scores are unaffected, but that run's total training time is inflated by about 26 minutes."
        found: The per-epoch times in the run's own log.
        fix: "Training cost is reported as the median epoch time, which one disturbed epoch does not move, and nothing else heavy runs on the laptop during the remaining runs."
    files: [scripts/eval_run.py, src/seg/evaluate.py, src/seg/metrics.py, tests/test_evaluate.py]

  - id: "4.4"
    stage: 4
    date: 2026-11-15
    title: Training under way, and the stage 4 page
    summary: "The first U-Net run is training. A stage 4 page in plain language explains the model with a clickable diagram drawn from its measured shapes, how we checked it, what it costs, and a snapshot of training so far."
    why: "The page has to be easy to follow for someone who has never trained a model, and every number on it still comes from saved data."
    tests: 158
    results:
      - {label: "Run 1, best validation Dice after 12 of 50 passes", value: "0.783"}
      - {label: Typical time per pass, value: "about 5 minutes"}
      - {label: Runs finished, value: "0 of 5"}
    problems:
      - kind: ours
        what: "The training queue was stopped from outside after 12 passes of run 1 and stayed stopped overnight. Its log has no error, only clean-up messages, so it was ended rather than crashed; it had been started from this working session."
        found: "The next morning no training process was running and the log ended at pass 12."
        fix: "It resumed from the checkpoint saved after pass 12, now fully detached from the session and kept awake with caffeinate, so the Mac does not sleep during a run."
    files: [site/stage-4.html, site/assets/site.js, site/assets/style.css, scripts/build_site_data.py]

  - id: "4.5"
    stage: 4
    date: 2026-11-15
    title: Project check, and run 1 finished
    summary: "A full check of the project: all tests, lint, the pinned environment, the published files, the live site and the training runs. Run 1 (learning rate 1e-4) finished; run 2 had stopped when the Mac restarted and was resumed."
    why: "Long unattended runs and a growing code base both drift. A check finds what the tests do not: stopped jobs, stale pages, and behaviour that only shows after an interruption."
    tests: 159
    results:
      - {label: "Run 1, best validation Dice at 0.5", value: "0.854 at epoch 45 of 50"}
      - {label: "Run 1, median training time per epoch", value: "299 s (5.5 h in total)"}
      - {label: "Run 2 when it stopped", value: "0.848 after 25 of 50 epochs"}
      - {label: Tests and lint, value: "158 of 158 passed before the fix, 159 after; lint clean"}
      - {label: Installed packages against the lock file, value: "identical"}
      - {label: Personal data in published files, value: "none found"}
    problems:
      - kind: ours
        what: "A resumed run replayed its first epochs' data order. On resume the training loader was seeded with the run's seed again, so from the resume point on it repeated the shuffles and augmentations of epochs 1, 2, 3 and so on. Run 1 was resumed after epoch 12 this way."
        found: Reading the resume path during the check, after two interruptions.
        fix: "A resumed run now gets a loader seed of its own, fixed by the run's seed and the resume epoch, and the summary records after which epochs a run was resumed. Run 1's scores stand: the replayed draws were valid training data, only not fresh ones. It is flagged as resumed in every table."
      - kind: data
        what: "Training stopped a second time: the Mac restarted at 12:19 with run 2 at epoch 25. The log ends with a GPU error and a terminated loader worker, both from the shutdown."
        found: "No training process was running, and the system's boot time matched the end of the log."
        fix: "Resumed from the checkpoint saved after epoch 25. Nothing survives a restart, so the queue has to be started again by hand: make queue CONFIG=configs/unet.yaml."
      - kind: ours
        what: "12 of run 2's 25 epochs took over 10 minutes, up to 56, because the laptop was in use. Total training time is therefore not a fair cost number for these runs."
        found: The per-epoch times in the run log.
        fix: "The run summary now also stores the median epoch time, and cost tables use median time times the number of epochs."
      - kind: ours
        what: "The queue rested 10 minutes after a run it had only skipped as finished."
        found: Restarting the queue.
        fix: It now rests only between two runs that actually train.
    files: [src/seg/train.py, scripts/run_queue.py, tests/test_train.py]
