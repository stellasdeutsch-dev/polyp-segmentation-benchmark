# Project journal: one entry per iteration (sub-step).
#
# The source of truth for the Journal page. Numbers that change with the code (test counts,
# model sizes, audit results) are measured by scripts/build_site_data.py, not typed here.
# "tests" is the size of the test suite when the iteration was finished, as reported by pytest.
#
# Problem kinds:
#   ours       a mistake of ours, caught by a check before it could affect a result
#   published  a problem in published papers or code
#   library    surprising behaviour of a library we depend on
#   data       a property of the data that changes how it must be used

iterations:
  - id: "1.1"
    stage: 1
    date: 2026-11-13
    title: How the polyp benchmark really works
    summary: Read the code and papers of Kvasir-SEG, PraNet and Polyp-PVT, the benchmark every later paper reports on.
    why: Published numbers can only be compared if they were measured the same way; the code shows how they were measured.
    results:
      - {label: Findings in the benchmark code, value: "6"}
      - {label: Published rows collected later in 1.4, value: "45"}
    problems:
      - kind: published
        what: Polyp-PVT picks its saved checkpoint by Dice on a test folder; PraNet has no validation set at all.
        found: Reading Train.py lines 109-121 and MyTrain.py lines 67-69.
        fix: Our protocol keeps a saved validation split and touches test sets once (decision D3).
      - kind: published
        what: The headline "mDice" averages Dice over 256 thresholds of a per-image stretched map; it is not Dice at 0.5.
        found: Reading MyTest.py line 37 and eval/main.m.
        fix: We report Dice at 0.5 and PraNet-style mDice side by side (decision D4).
      - kind: published
        what: The PraNet paper describes a random 80/10/10 split; the released data uses fixed folders.
        found: Comparing paper Section 3.1 with the README data section.
        fix: We follow the released folders, which is what later papers did.
    files: [research/01_polyp_protocol.md]

  - id: "1.2"
    stage: 1
    date: 2026-11-13
    title: The U-Net lineage
    summary: Compared the 2015 U-Net paper with three implementations (milesial, SMP, nnU-Net) and read nnU-Net Revisited.
    why: Our first two models are U-Nets; knowing which details came from where lets us explain every design choice.
    results:
      - {label: Code links pinned and checked, value: "23"}
      - {label: Validation pitfalls named by nnU-Net Revisited, value: "4"}
    problems:
      - kind: published
        what: milesial evaluates with drop_last=True and averages Dice per batch, so results depend on batch size and skip images.
        found: Reading train.py line 55 and evaluate.py lines 30 and 40.
        fix: We score every image and average per image.
      - kind: ours
        what: The plan said the SMP author works at Hugging Face; his profile says formerly.
        found: Checking the GitHub profile before writing the note.
        fix: Corrected in the note before it was saved.
    files: [research/02_unet_lineage.md]

  - id: "1.3"
    stage: 1
    date: 2026-11-13
    title: Beyond U-Net
    summary: Read Mask2Former, SegFormer, EoMT, DINOv3 and MONAI at code level and sorted every model into three designs.
    why: Rung 3 uses a frozen DINOv3 backbone, and the server stage uses mask transformers; we need to know where each is weak.
    results:
      - {label: "EoMT gap to Mask2Former, ViT-S vs ViT-g", value: "5.8 vs 0.7 PQ"}
      - {label: "DINOv3 vs DINOv2 ViT-S, ADE20K", value: "47.0 vs 45.5 mIoU"}
    problems:
      - kind: ours
        what: The plan named NVIDIA and King's College London as MONAI's founders without a source.
        found: The MONAI paper page lists no affiliations.
        fix: Confirmed from the full paper ("initially led by NVIDIA and King's College London") before using it.
    files: [research/03_foundation_models.md]

  - id: "1.4"
    stage: 1
    date: 2026-11-13
    title: Published numbers and the project's rules
    summary: Collected 45 published results with their source tables, drew the first chart, and wrote fifteen decisions.
    why: Every later stage follows these rules, so each one needed a reason and a source.
    results:
      - {label: Published results, value: "45"}
      - {label: Decisions, value: "15"}
      - {label: "U-Net to best model gap, unseen hospitals", value: "up to 0.39 Dice"}
    problems:
      - kind: ours
        what: The first chart title said the gap is "3x larger on unseen hospitals", which overstates CVC-300 (0.16).
        found: Looking at the rendered chart before sharing it.
        fix: Rewrote the title to state the actual range, 0.1 to 0.39.
      - kind: ours
        what: The "(vs PraNet)" label was cut off at the chart's right edge.
        found: Looking at the rendered chart.
        fix: Shortened to an asterisk with a footnote.
    files: [research/published_results.csv, research/decisions.md, research/plot_published.py]

  - id: "1.5"
    stage: 1
    date: 2026-11-13
    title: The explainer site
    summary: Built the site shell, the home page and the stage 1 page with an interactive chart and two hands-on demos.
    why: You should be able to explain every step as your own; the site is the study guide and the showcase.
    results:
      - {label: Widths checked, value: "1440, 834, 390"}
      - {label: Console errors, value: "0"}
    problems:
      - kind: ours
        what: The note claimed boundary pixels get up to 6x weight in PraNet's loss; at a straight edge it is about 3.5x.
        found: Building the weight-map demo, which computes the weights.
        fix: Corrected the note, the page and the colour scale.
      - kind: ours
        what: The home-page chart image was stretched vertically.
        found: Checking the page at 834 px.
        fix: Added height auto so images keep their aspect ratio.
      - kind: ours
        what: In dark mode the weight colours were reversed and a chart label ran off the left edge on phones.
        found: Checking the page in dark mode and at 390 px.
        fix: One colour scale for both themes; group labels moved to the left margin.
    files: [site/index.html, site/stage-1.html]

  - id: "2.1"
    stage: 2
    date: 2026-11-13
    title: Environment
    summary: Python 3.11 environment with exact pinned versions, one-command setup, and helpers for device, seeds and cost.
    why: Anyone must be able to rebuild the same environment, and cost needs a reliable memory measurement.
    tests: 10
    results:
      - {label: PyTorch, value: "2.15.0 on MPS"}
      - {label: Memory counter checked, value: "256 MB read as 256.0 MB"}
    problems:
      - kind: library
        what: torch.mps has no peak-memory counter in PyTorch 2.15, and the driver total grows in 1 GB steps.
        found: Listing the available functions and testing them on known allocations.
        fix: Use torch.accelerator's peak counter, which reads known allocations exactly (decision D15).
      - kind: ours
        what: Eight lint findings, including two unchecked zip() calls in the chart script.
        found: Running the linter.
        fix: All fixed; lint now runs on every change.
    files: [src/seg/env.py, scripts/check_env.py, requirements-lock.txt]

  - id: "2.2"
    stage: 2
    date: 2026-11-13
    title: Data and the validation split
    summary: Downloaded the benchmark with checksums, audited it, and saved a validation split made of whole videos.
    why: A validation set that shares videos with training measures memory, not generalisation.
    tests: 32
    results:
      - {label: Validation images, value: "158"}
      - {label: "Sequence table vs images, AUC", value: "0.965"}
      - {label: Exact train/test duplicates, value: "0"}
    problems:
      - kind: data
        what: The CVC-ClinicDB test set takes its frames from 26 videos that also have training frames.
        found: Mapping every frame to its video with the dataset's own table.
        fix: Validation uses the only three videos with no test frame; CVC-ClinicDB results are labelled as near-copy performance.
      - kind: ours
        what: The plan was to recover video boundaries from image similarity, but only 15 of the 28 most dissimilar pairs were true boundaries.
        found: Comparing the similarity signal with the official sequence table.
        fix: Used the published table, and kept the images only as a check of it.
      - kind: published
        what: The PraNet paper says 31 clips; the dataset's own table has 29 sequences.
        found: Reading the CVC-ClinicDB table.
        fix: The table is used; the difference is noted.
      - kind: data
        what: The training archive uses an image/ folder (test sets use images/) and contains six macOS .DS_Store files.
        found: Counting files after extraction.
        fix: Paths handled explicitly; the extractor skips macOS metadata.
    files: [scripts/download_data.py, scripts/make_splits.py, reports/data_inventory.md, data/splits/val_seed0.json]

  - id: "2.3"
    stage: 2
    date: 2026-11-13
    title: Metrics we can trust
    summary: Dice, IoU, Boundary IoU and PraNet-style mDice, each checked against an implementation we did not write.
    why: If the ruler is wrong, every comparison is wrong.
    tests: 66
    results:
      - {label: Agreement with SMP and MONAI, value: exact}
      - {label: Agreement with official Boundary IoU code, value: pixel-identical}
      - {label: "Effect of float threshold ties on mDice", value: "at most 0.0016"}
    problems:
      - kind: ours
        what: All metrics crashed on GPU tensors, because Apple's MPS backend has no float64.
        found: Running the metrics on MPS, a case the CPU tests could not reach.
        fix: Count on the GPU, divide on the CPU; a GPU test keeps it fixed.
      - kind: ours
        what: The slow port and the fast version disagreed at 66 of 256 thresholds.
        found: The literal-port test failed.
        fix: The cause was float ties at a threshold; measured the effect (at most 0.0016) and kept exact integer thresholds.
    files: [src/seg/metrics.py, tests/test_metrics.py, tests/reference/boundary_iou_official.py]

  - id: "2.4"
    stage: 2
    date: 2026-11-13
    title: Data loader
    summary: One augmentation for every model, with image and mask proven to move together.
    why: An augmentation that moves the image but not its mask silently trains on wrong labels.
    tests: 82
    results:
      - {label: "Image-mask agreement, worst of 160 draws", value: "0.935 IoU"}
      - {label: "Same check on a broken pipeline", value: "0.257 median"}
      - {label: "Loading speed, 4 workers", value: "746 images/s"}
    problems:
      - kind: ours
        what: A helper named test_items, then testset_items, was collected by pytest as a test.
        found: The test run reported an error for a fixture.
        fix: Renamed to items_for_testset.
    files: [src/seg/data.py, tests/test_data.py, reports/figures/augmentations.png]

  - id: "2.5"
    stage: 2
    date: 2026-11-13
    title: Losses and the training loop
    summary: Losses, one training loop for every model, an overfit check, and a timed epoch that set the budget.
    why: Every model must be trained by exactly the same procedure, and the budget must fit the laptop.
    tests: 103
    results:
      - {label: "Overfit check, 32 images", value: "Dice 0.980"}
      - {label: Speed-up after profiling, value: "2.3x"}
      - {label: Epoch budget, value: "50 epochs"}
    problems:
      - kind: published
        what: PraNet's structure loss passes reduce='none', which PyTorch reads as true; the boundary weights cancel out of the BCE term.
        found: Testing what that argument returns.
        fix: Both versions exist; the ablation tests whether the weighting matters.
      - kind: library
        what: albumentations 2 ignores the global seed, and loader workers repeated each other's draws (4 of 8 distinct with 2 workers).
        found: Testing reproducibility with and without workers.
        fix: Each worker gets its own seed; a test checks distinct and repeatable draws.
      - kind: ours
        what: "--set lr=3e-4 would have passed the learning rate as text: YAML 1.1 reads 3e-4 as a string."
        found: A config test failed.
        fix: Every setting is converted to its declared type.
      - kind: ours
        what: The first timed epoch took 65 s + 25 s, more than twice the bare compute.
        found: Profiling a bare training step and validation separately.
        fix: Workers now persist across epochs, and the loss is read once per epoch.
    files: [src/seg/losses.py, src/seg/train.py, src/seg/models.py]

  - id: "2.6"
    stage: 2
    date: 2026-11-14
    title: Stage 2 explainer page
    summary: Page with an overlap calculator, a threshold sweep, and charts filled from saved results.
    why: The checks are only useful if they can be explained.
    tests: 103
    results:
      - {label: "2-pixel shift: IoU vs Boundary IoU", value: "0.92 vs 0.505"}
      - {label: "Biased model: raw Dice vs mDice", value: "0.000 vs 0.835"}
    problems:
      - kind: ours
        what: Peak memory was quoted as 1.86 GB next to an 11.84 GB limit counted in different units; it is 1.82 GB.
        found: The page computed the value from the saved results.
        fix: One unit everywhere.
      - kind: ours
        what: The decisions said "about 34 minutes" and "2.2x" from a rough average including the first epoch.
        found: The collector script computed steady-state epochs.
        fix: Now 32 minutes and 2.3x, from the script.
      - kind: ours
        what: The demo text claimed low confidence alone breaks Dice at 0.5; it takes a bias as well.
        found: Testing the demo's settings before publishing the text.
        fix: Rewrote the explanation to match what the demo shows.
    files: [site/stage-2.html, reports/stage2_checks.json]

  - id: "3.1"
    stage: 3
    date: 2026-11-14
    title: The PraNet reference
    summary: Fetched PraNet's code at the pinned commit, its released weights and the authors' own prediction maps, and loaded the model on the Mac.
    why: Stage 3 must reproduce PraNet's published numbers before any of our own results count (decision D13).
    tests: 105
    results:
      - {label: Weights matched, value: "all, strict"}
      - {label: "Speed on the Mac GPU", value: "56 ms per image"}
      - {label: Published maps included, value: "PraNet, U-Net, U-Net++, SFA"}
    problems:
      - kind: published
        what: PraNet's constructor loads its backbone from a hard-coded path on the authors' own machine.
        found: The first load failed with that path in the error.
        fix: Our loader builds the backbone without it; the released weights contain every parameter.
      - kind: ours
        what: The first workaround used functools.partial, which an explicit pretrained=True in PraNet's code overrides.
        found: The load still failed with the same path.
        fix: A small wrapper that always forces pretrained off.
    files: [src/seg/pranet.py, scripts/fetch_pranet.py]

